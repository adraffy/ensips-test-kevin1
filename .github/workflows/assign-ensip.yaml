name: Assign ENSIP Number

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: assign-ensip
  cancel-in-progress: false

jobs:
  assign:
    # Only run for PR comments containing /assign-ensip from authorized users
    if: >-
      github.event.issue.pull_request
      && contains(github.event.comment.body, '/assign-ensip')
      && (
        github.event.comment.author_association == 'OWNER'
        || github.event.comment.author_association == 'MEMBER'
        || github.event.comment.author_association == 'COLLABORATOR'
      )
    runs-on: ubuntu-latest
    env:
      PR_NUMBER: ${{ github.event.issue.number }}
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Compute next ENSIP number
        id: number
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          # Get highest number from the default branch
          MASTER_MAX=$(ls ensips/ | grep -oE '^[0-9]+\.md$' | sed 's/\.md$//' | sort -n | tail -1)
          MASTER_MAX=${MASTER_MAX:-0}
          echo "Highest number on default branch: $MASTER_MAX"

          # Get highest number from ALL PRs (open + closed) to avoid reusing
          # numbers from closed/abandoned PRs
          PR_MAX=0
          PR_NUMBERS=$(gh pr list --state all --json number --jq '.[].number')

          for pr_num in $PR_NUMBERS; do
            if [ "$pr_num" = "$PR_NUMBER" ]; then
              continue
            fi

            ENSIP_NUMS=$(gh pr view "$pr_num" --json files --jq '.files[].path' \
              | grep -oE 'ensips/[0-9]+\.md$' \
              | sed 's|ensips/||; s|\.md||' || true)

            for n in $ENSIP_NUMS; do
              if [ "$n" -gt "$PR_MAX" ]; then
                PR_MAX=$n
              fi
            done
          done

          echo "Highest number across all PRs: $PR_MAX"

          if [ "$MASTER_MAX" -gt "$PR_MAX" ]; then
            HIGHEST=$MASTER_MAX
          else
            HIGHEST=$PR_MAX
          fi

          NEXT=$((HIGHEST + 1))
          echo "Next ENSIP number: $NEXT"
          echo "next=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Checkout PR branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: gh pr checkout "$PR_NUMBER"

      - name: Find new ENSIP file
        id: find
        run: |
          # Find .md files in ensips/ that are new in this PR (not on main)
          NEW_FILES=$(git diff --name-only --diff-filter=A origin/main...HEAD -- 'ensips/*.md' || true)
          FILE_COUNT=$(echo "$NEW_FILES" | grep -c . || true)

          echo "New .md files in ensips/: $NEW_FILES (count: $FILE_COUNT)"

          if [ "$FILE_COUNT" -eq 0 ] || [ -z "$NEW_FILES" ]; then
            # No new files — check if a number was already assigned on this branch
            ASSIGNED=$(git diff --name-only origin/main...HEAD -- 'ensips/*.md' \
              | grep -oE 'ensips/[0-9]+\.md$' || true)

            if [ -n "$ASSIGNED" ]; then
              NUM=$(echo "$ASSIGNED" | head -1 | sed 's|ensips/||; s|\.md||')
              echo "status=already_assigned" >> "$GITHUB_OUTPUT"
              echo "assigned_num=$NUM" >> "$GITHUB_OUTPUT"
            else
              echo "status=no_file" >> "$GITHUB_OUTPUT"
            fi
          elif [ "$FILE_COUNT" -eq 1 ]; then
            echo "status=found" >> "$GITHUB_OUTPUT"
            echo "file=$NEW_FILES" >> "$GITHUB_OUTPUT"
          else
            echo "status=multiple" >> "$GITHUB_OUTPUT"
            echo "files=$NEW_FILES" >> "$GITHUB_OUTPUT"
          fi

      - name: Comment if already assigned
        if: steps.find.outputs.status == 'already_assigned'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          NUM=${{ steps.find.outputs.assigned_num }}
          gh pr comment "$PR_NUMBER" \
            --body "This PR has already been assigned **ENSIP-${NUM}**."

      - name: Comment if no ENSIP file found
        if: steps.find.outputs.status == 'no_file'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --body "No new ENSIP file found in this PR. The \`/assign-ensip\` command expects a new \`.md\` file in the \`ensips/\` directory."

      - name: Comment if multiple files found
        if: steps.find.outputs.status == 'multiple'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --body "Multiple new ENSIP files found in this PR. Please submit one ENSIP per PR."

      - name: Rename file and update title
        if: steps.find.outputs.status == 'found'
        id: rename
        run: |
          NEXT=${{ steps.number.outputs.next }}
          FILE="${{ steps.find.outputs.file }}"
          FILENAME=$(basename "$FILE")

          # Rename the file to the assigned number
          git mv "$FILE" "ensips/${NEXT}.md"

          # Update the H1 title in the file
          # Extract the current H1 line
          H1_LINE=$(grep -m1 '^# ' "ensips/${NEXT}.md" || true)

          if echo "$H1_LINE" | grep -qE '^# ENSIP-([0-9]+|[Xx]):'; then
            # Standard format: # ENSIP-X: Title or # ENSIP-123: Title
            # Replace the number/placeholder, keep the title text
            sed -i "s/^# ENSIP-\([0-9]\+\|[Xx]\):/# ENSIP-${NEXT}:/" "ensips/${NEXT}.md"
          elif echo "$H1_LINE" | grep -qE '^# .+'; then
            # Non-standard H1 — extract title text and rewrite
            TITLE_TEXT=$(echo "$H1_LINE" | sed 's/^# //')
            sed -i "s|^# .*|# ENSIP-${NEXT}: ${TITLE_TEXT}|" "ensips/${NEXT}.md"
          fi

          echo "Renamed $FILE -> ensips/${NEXT}.md"
          echo "old_file=$FILENAME" >> "$GITHUB_OUTPUT"

      - name: Commit and push
        if: steps.find.outputs.status == 'found'
        id: push
        run: |
          NEXT=${{ steps.number.outputs.next }}
          git config user.name "ensips-earl[bot]"
          git config user.email "3398141+ensips-earl[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Assign ENSIP-${NEXT}"

          if git push; then
            echo "pushed=true" >> "$GITHUB_OUTPUT"
          else
            echo "pushed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Update PR title
        if: steps.find.outputs.status == 'found' && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          NEXT=${{ steps.number.outputs.next }}

          # Get current PR title
          CURRENT_TITLE=$(gh pr view "$PR_NUMBER" --json title --jq '.title')

          # If title already has ENSIP-X or ENSIP-{number} prefix, replace it
          if echo "$CURRENT_TITLE" | grep -qE '^ENSIP-([0-9]+|[Xx]):'; then
            NEW_TITLE=$(echo "$CURRENT_TITLE" | sed "s/^ENSIP-\([0-9]\+\|[Xx]\):/ENSIP-${NEXT}:/")
          else
            # Prepend the ENSIP number
            NEW_TITLE="ENSIP-${NEXT}: ${CURRENT_TITLE}"
          fi

          gh pr edit "$PR_NUMBER" --title "$NEW_TITLE"
          echo "Updated PR title to: $NEW_TITLE"

      - name: Comment on push failure
        if: steps.find.outputs.status == 'found' && steps.push.outputs.pushed == 'false'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --body "Failed to push the ENSIP number assignment. For fork PRs, ensure the contributor has enabled 'Allow edits from maintainers'."

      - name: Comment on successful assignment
        if: steps.find.outputs.status == 'found' && steps.push.outputs.pushed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          NEXT=${{ steps.number.outputs.next }}
          OLD_FILE=${{ steps.rename.outputs.old_file }}
          gh pr comment "$PR_NUMBER" \
            --body "$(cat <<EOF
          This proposal has been assigned **ENSIP-${NEXT}**.

          - File renamed: \`ensips/${OLD_FILE}\` → \`ensips/${NEXT}.md\`
          - Title updated to include \`ENSIP-${NEXT}\`
          EOF
          )"
